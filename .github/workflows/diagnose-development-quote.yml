name: Diagnose development quote failure
on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/diagnose-development-quote.yml'
      - 'scripts/diagnose-development-quote.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read staging settings and historical logs (no enquiry or email)
        run: node scripts/diagnose-development-quote.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
