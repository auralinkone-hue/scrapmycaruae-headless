# Cloudflare deployment secrets configured
name: Deploy development preview

on:
  push:
    branches:
      - development
  workflow_dispatch:

concurrency:
  group: scrapmycaruae-development-preview
  cancel-in-progress: true

jobs:
  deploy:
    if: "github.ref == 'refs/heads/development' && !contains(github.event.head_commit.message, '[diagnostic-only]')"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      DEPLOYMENT_WORKER_NAME: smc-headless-worker
      DEPLOYMENT_CONFIG_FILE: wrangler.jsonc
      PUBLIC_WIX_CLIENT_ID: f3ac0e15-b92a-42ce-8340-f9ec2a40d267
      WIX_QUOTE_REQUESTS_COLLECTION_ID: QuoteRequestsStaging
      PUBLIC_SEO_ENV: staging
      PUBLIC_SITE_URL: https://www.scrapmycaruae.com
      PUBLIC_GTM_ID: GTM-TFQ7BDGX
      PUBLIC_ANALYTICS_ENABLED: "false"

    steps:
      - name: Checkout development
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify staging target before build
        run: npm run deployment:verify -- staging

      - name: Run automated tests
        run: npm test

      - name: Configure optional staging notification ledger
        run: node scripts/configure-quote-notification-binding.mjs
        env:
          QUOTE_NOTIFICATIONS_DATABASE_ID: ${{ vars.QUOTE_NOTIFICATIONS_DATABASE_ID }}

      - name: Build Astro
        run: npm run build

      - name: Verify generated staging target before upload
        run: npm run deployment:verify -- staging --built

      - name: Deploy Cloudflare Worker preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name smc-headless-worker
