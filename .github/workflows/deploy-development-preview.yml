# Cloudflare deployment secrets configured
name: Deploy development preview

on:
  push:
    branches:
      - development
  workflow_dispatch:

concurrency:
  group: scrapmycaruae-development-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      PUBLIC_WIX_CLIENT_ID: f3ac0e15-b92a-42ce-8340-f9ec2a40d267
      PUBLIC_SEO_ENV: staging
      PUBLIC_SITE_URL: https://www.scrapmycaruae.com

    steps:
      - name: Checkout development
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Deploy Cloudflare Worker preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
